<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>সুমাইয়া খাতুন - WhatsApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '"Hind Siliguri"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100vw !important;
            max-width: 100% !important;
            min-height: 100dvh !important;
            background-color: #0b141a !important;
            overflow-x: hidden !important;
        }
        .wa-doodle-bg {
            background-color: #0b141a;
            background-image: url("data:image/svg+xml,%3Csvg width='180' height='180' viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%231d2b34' stroke-width='1.35' stroke-linecap='round' stroke-linejoin='round' opacity='0.85'%3E%3Ccircle cx='30' cy='32' r='11'/%3E%3Cpath d='M25 30h2M33 30h2M26 36c2 2.5 6 2.5 8 0'/%3E%3Cpath d='M82 22l6 10h-12zM76 38h18v12H76z'/%3E%3Cpath d='M135 24c6 0 11 4.5 11 10s-5 10-11 10-11-4.5-11-10 5-10 11-10zm-4 10h8m-4-4v8'/%3E%3Crect x='22' y='82' width='22' height='14' rx='3'/%3E%3Ccircle cx='33' cy='89' r='3.5'/%3E%3Cpath d='M78 88c0-6 6-10 12-10s12 4 12 10-5 12-12 16c-7-4-12-10-12-16z'/%3E%3Cpath d='M132 76l16 16m0-16l-16 16'/%3E%3Cpath d='M26 142c5-8 16-8 21 0-5 8-16 8-21 0z'/%3E%3Ccircle cx='36.5' cy='142' r='2.5'/%3E%3Cpath d='M84 134v20m-7-13h14'/%3E%3Ccircle cx='140' cy='142' r='12'/%3E%3Cpath d='M135 142h10M140 137v10'/%3E%3C/g%3E%3C/svg%3E");
            background-repeat: repeat;
        }
        a, button {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="text-[#e9edef] min-h-[100dvh] w-full m-0 p-0 selection:bg-[#00a884] selection:text-white">

    <!-- ফুল-স্ক্রিন WhatsApp চ্যাট কন্টেইনার (বাম থেকে ডান ১০০% স্ক্রিন জুড়ে) -->
    <div id="appWrapper" class="w-full min-h-[100dvh] wa-doodle-bg flex flex-col justify-between relative left-0 right-0">

        <!-- উপরের WhatsApp হেডার বার -->
        <header class="sticky top-0 z-20 w-full bg-[#111b21]/95 backdrop-blur-md border-b border-[#202c33] px-3 sm:px-6 lg:px-8 py-2.5 sm:py-3 flex items-center justify-between gap-2 shadow-sm">
            <div class="flex items-center gap-2 sm:gap-3 min-w-0">
                <!-- ব্যাক অ্যারো (Link 1) -->
                <a 
                    href="https://auctionr.org/4/5eb2e9d313c072eed4801583575b2f29" 
                    target="_blank" 
                    rel="noopener noreferrer"
                    aria-label="ফিরে যান"
                    class="w-9 h-9 sm:w-10 sm:h-10 rounded-full flex items-center justify-center text-[#aebac1] hover:bg-[#202c33] hover:text-white transition shrink-0"
                >
                    <i class="fa-solid fa-arrow-left text-base sm:text-lg"></i>
                </a>

                <!-- প্রোফাইল ছবি + সুমাইয়া খাতুন (Link 2) -->
                <a 
                    href="https://auctionr.org/4/48d9d0c1bc9d2561cf5769fe05d77bbb" 
                    target="_blank" 
                    rel="noopener noreferrer"
                    class="flex items-center gap-2.5 sm:gap-3.5 min-w-0 group py-0.5 pr-3 rounded-full hover:bg-[#1f2c34]/70 transition"
                >
                    <div class="w-10 h-10 sm:w-11 sm:h-11 rounded-full overflow-hidden bg-[#202c33] ring-1 ring-white/15 shrink-0">
                        <img 
                            id="profileImage"
                            src="https://i.postimg.cc/m1VswSdp/image.jpg" 
                            onerror="handleImageFallback(this)"
                            alt="সুমাইয়া খাতুন" 
                            class="w-full h-full object-cover"
                        >
                    </div>
                    <div class="min-w-0">
                        <h1 class="text-[16.5px] sm:text-[18px] font-semibold text-[#e9edef] truncate leading-snug group-hover:text-[#00a884] transition-colors">
                            সুমাইয়া খাতুন
                        </h1>
                        <p class="text-[11px] sm:text-xs text-[#00a884] font-medium leading-tight">
                            online
                        </p>
                    </div>
                </a>
            </div>

            <!-- ডান পাশের ভিডিও কল, অডিও কল এবং থ্রি-ডট মেনু আইকন -->
            <div class="flex items-center gap-1.5 sm:gap-3 shrink-0 text-[#aebac1]">
                <a 
                    href="https://auctionr.org/4/eba8ad870548d0d12c50c4c604cdc199" 
                    target="_blank" 
                    rel="noopener noreferrer"
                    aria-label="ভিডিও কল"
                    title="ভিডিও কল"
                    class="w-9 h-9 sm:w-10 sm:h-10 rounded-full flex items-center justify-center hover:bg-[#202c33] hover:text-white transition"
                >
                    <i class="fa-solid fa-video text-[17px] sm:text-[19px]"></i>
                </a>
                <a 
                    href="https://auctionr.org/4/5eb2e9d313c072eed4801583575b2f29" 
                    target="_blank" 
                    rel="noopener noreferrer"
                    aria-label="অডিও কল"
                    title="অডিও কল"
                    class="w-9 h-9 sm:w-10 sm:h-10 rounded-full flex items-center justify-center hover:bg-[#202c33] hover:text-white transition"
                >
                    <i class="fa-solid fa-phone text-[16px] sm:text-[18px]"></i>
                </a>
                <a 
                    href="https://auctionr.org/4/48d9d0c1bc9d2561cf5769fe05d77bbb" 
                    target="_blank" 
                    rel="noopener noreferrer"
                    aria-label="আরও অপশন"
                    title="আরও অপশন"
                    class="w-9 h-9 sm:w-10 sm:h-10 rounded-full flex items-center justify-center hover:bg-[#202c33] hover:text-white transition"
                >
                    <i class="fa-solid fa-ellipsis-vertical text-[17px] sm:text-[19px]"></i>
                </a>
            </div>
        </header>

        <!-- মাঝখানের সম্পূর্ণ ফাঁকা চ্যাট এরিয়া (Link 3) -->
        <a 
            href="https://auctionr.org/4/eba8ad870548d0d12c50c4c604cdc199" 
            target="_blank" 
            rel="noopener noreferrer"
            aria-label="চ্যাট শুরু করুন"
            class="flex-1 w-full px-4 sm:px-8 py-5 sm:py-8 flex flex-col items-center justify-start gap-3 cursor-pointer"
        >
            <span class="px-3.5 py-1 rounded-lg bg-[#182229]/95 text-[#8696a0] text-xs sm:text-[13px] font-medium shadow-sm border border-white/5">
                Today
            </span>

            <div class="w-full max-w-[340px] sm:max-w-[460px] rounded-xl bg-[#182229]/95 px-4 py-3 text-center shadow-sm border border-white/5 hover:bg-[#1d2931] transition">
                <p class="text-[11.5px] sm:text-[13px] leading-[1.5] text-[#ffd279]/90">
                    <i class="fa-solid fa-lock text-[10px] sm:text-xs mr-1 text-[#8696a0]"></i>
                    Messages and calls are end-to-end encrypted. Only people in this chat can read, listen to, or share them.
                    <span class="text-[#53bdeb] font-medium">Learn more</span>
                </p>
            </div>
        </a>

        <!-- নিচের Message ইনপুট বার ও সবুজ ভয়েস রেকর্ড বাটন -->
        <footer class="sticky bottom-0 z-20 w-full px-3 sm:px-6 lg:px-8 py-2.5 sm:py-3.5 bg-gradient-to-t from-[#0b141a] via-[#0b141a]/95 to-transparent flex items-center gap-2.5 sm:gap-3">
            <div class="flex-1 h-12 sm:h-13 rounded-full bg-[#202c33] px-3 sm:px-4 flex items-center justify-between gap-2 text-[#8696a0] shadow-md border border-white/5">
                <a 
                    href="https://auctionr.org/4/5eb2e9d313c072eed4801583575b2f29" 
                    target="_blank" 
                    rel="noopener noreferrer"
                    aria-label="ইমোজি"
                    class="w-9 h-9 rounded-full flex items-center justify-center hover:bg-white/5 hover:text-white transition shrink-0"
                >
                    <i class="fa-regular fa-face-smile text-xl sm:text-[22px]"></i>
                </a>

                <a 
                    href="https://auctionr.org/4/48d9d0c1bc9d2561cf5769fe05d77bbb" 
                    target="_blank" 
                    rel="noopener noreferrer"
                    class="flex-1 h-full flex items-center text-[15px] sm:text-base text-[#8696a0] hover:text-[#d1d7db] truncate cursor-pointer"
                >
                    Message
                </a>

                <div class="flex items-center gap-1 sm:gap-2 shrink-0">
                    <a 
                        href="https://auctionr.org/4/eba8ad870548d0d12c50c4c604cdc199" 
                        target="_blank" 
                        rel="noopener noreferrer"
                        aria-label="ডকুমেন্ট বা ফাইল পাঠান"
                        class="w-9 h-9 rounded-full flex items-center justify-center hover:bg-white/5 hover:text-white transition"
                    >
                        <i class="fa-solid fa-paperclip text-lg sm:text-[19px] -rotate-45"></i>
                    </a>
                    <a 
                        href="https://auctionr.org/4/5eb2e9d313c072eed4801583575b2f29" 
                        target="_blank" 
                        rel="noopener noreferrer"
                        aria-label="ক্যামেরা"
                        class="w-9 h-9 rounded-full flex items-center justify-center hover:bg-white/5 hover:text-white transition"
                    >
                        <i class="fa-solid fa-camera text-lg sm:text-[19px]"></i>
                    </a>
                </div>
            </div>

            <a 
                href="https://auctionr.org/4/48d9d0c1bc9d2561cf5769fe05d77bbb" 
                target="_blank" 
                rel="noopener noreferrer"
                aria-label="ভয়েস রেকর্ড করুন"
                class="w-12 h-12 sm:w-13 sm:h-13 rounded-full bg-[#00a884] hover:bg-[#06cf9c] active:scale-95 text-[#111b21] flex items-center justify-center shadow-lg transition shrink-0"
            >
                <i class="fa-solid fa-microphone text-lg sm:text-xl"></i>
            </a>
        </footer>

    </div>

    <script>
        // ভুলবশত পেজের শুরুতে বা শেষে ```html লেখা পেস্ট হলে তা স্বয়ংক্রিয়ভাবে মুছে ফুল-স্ক্রিন করার স্ক্রিপ্ট
        document.addEventListener("DOMContentLoaded", function () {
            document.body.childNodes.forEach(function (node) {
                if (node.nodeType === Node.TEXT_NODE && node.textContent.trim() !== "") {
                    node.remove();
                }
            });
        });

        let fallbackStep = 0;
        function handleImageFallback(img) {
            fallbackStep++;
            if (fallbackStep === 1) {
                img.src = "[https://i.postimg.cc/m1VswSdp/photo.jpg](https://i.postimg.cc/m1VswSdp/photo.jpg)";
            } else if (fallbackStep === 2) {
                img.src = "[https://i.postimg.cc/m1VswSdp/1.jpg](https://i.postimg.cc/m1VswSdp/1.jpg)";
            } else {
                img.onerror = null;
                img.src = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(`
                    <svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" viewBox="0 0 200 200">
                        <defs>
                            <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#111b21"/>
                                <stop offset="100%" stop-color="#00a884"/>
                            </linearGradient>
                        </defs>
                        <rect width="200" height="200" fill="url(#bg)"/>
                        <circle cx="100" cy="76" r="34" fill="#e9edef"/>
                        <path d="M42 178 C42 136, 158 136, 158 178 Z" fill="#e9edef"/>
                    </svg>
                `);
            }
        }
    </script>
</body>
</html>
